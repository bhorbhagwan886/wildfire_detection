<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wildfire AI - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>

/* ====== Gradient Background ====== */
body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
}


/* ====== Glassmorphism Effect ====== */
.glass-card {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 15px;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    transition: 0.3s ease;
}

.glass-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 40px rgba(255, 0, 0, 0.4);
}

/* ====== Navbar Glass ====== */
.navbar {
    background: rgba(0, 0, 0, 0.6) !important;
    backdrop-filter: blur(10px);
}

/* ====== Buttons Gradient ====== */
.btn-danger {
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    border: none;
}

.btn-warning {
    background: linear-gradient(45deg, #f7971e, #ffd200);
    border: none;
}

/* ====== Footer Glass ====== */
footer {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
}
 /* ===== GLASS NAVBAR ===== */
.glass-nav {
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* Brand Glow */
.brand-glow {
    color: #ff4b2b !important;
    text-shadow: 0 0 12px rgba(255,75,43,0.8);
}

/* Nav Links */
.nav-link {
    color: #ddd !important;
    transition: 0.3s ease;
}

.nav-link:hover {
    color: #ff4b2b !important;
    text-shadow: 0 0 8px rgba(255,75,43,0.7);
}

/* Active Link */
.nav-link.active {
    color: #ff4b2b !important;
    font-weight: 600;
}

/* ===== GLASS FOOTER ===== */
.glass-footer {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.1);
}

/* Smooth page feel */
html {
    scroll-behavior: smooth;
}
main {
    flex: 1;
}

</style>

</head>

<body class="bg-dark text-light">

<!-- ================= HEADER ================= -->
<header>
<nav class="navbar navbar-expand-lg glass-nav px-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold brand-glow" href="/">🔥 Wildfire AI</a>

    <button class="navbar-toggler text-light" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
      </ul>
    </div>
  </div>
</nav>

</header>

<!-- ================= MAIN ================= -->
<main class="container py-4">

  <!-- Hero Section -->
  <div class="text-center mb-5">
    <h1 class="fw-bold">Wildfire Detection System</h1>
    <p class="text-secondary">AI-Based Forest Fire Risk Prediction System</p>
  </div>

  <!-- Cards -->
  <div class="row g-4">

    <div class="col-md-4">
      <div class="card bg-secondary text-light h-100 shadow">
        <div class="card-body text-center">
          <h5>📷 Image Detection</h5>
          <input type="file" class="form-control my-3">
          <button class="btn btn-danger w-100">Analyze Image</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card bg-secondary text-light h-100 shadow">
        <div class="card-body text-center">
          <h5>🌡 Environmental Data</h5>
          <input class="form-control mb-2" placeholder="Temperature">
          <input class="form-control mb-2" placeholder="Humidity">
          <input class="form-control mb-2" placeholder="Wind Speed">
          <button class="btn btn-warning w-100">Predict Risk</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card bg-secondary text-light h-100 shadow">
        <div class="card-body text-center">
          <h5>🛡 AI Insights</h5>
          <p>Risk Level: <b class="text-warning">Moderate</b></p>
          <p>Recommendation: Stay Alert</p>
        </div>
      </div>
    </div>

  </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="glass-footer text-center mt-auto">
  <p class="mb-1 fw-semibold">© 2026 Wildfire AI</p>
  <small class="text-light opacity-75">Designed by Bhagvan Bhor</small>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
